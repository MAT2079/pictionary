# AI-themed trivia cards shown on the Presentation view while images generate.
# Copy to trivia.yaml to customise. Keep them short and projector-legible.

- text: "The 'T' in GPT stands for Transformer, the neural network architecture introduced in 2017."
- text: "Stable Diffusion generates images by gradually removing noise from a random starting point."
- text: "A 'prompt' is just the text instruction you give an AI model. You're all prompt engineers now."
- text: "The phrase 'negative prompt' tells an image model what you DON'T want to see."
- text: "Diffusion models were inspired by thermodynamics - specifically how particles spread out over time."
- text: "An AI model's 'parameters' are the billions of numbers it tunes during training."
- text: "'Hallucination' is the polite term for when an AI confidently makes something up."
- text: "The first image-generating GAN was built in 2014. Things escalated quickly."
- text: "'Tokens' are the chunks of text a language model reads - often pieces of words, not whole words."
- text: "CLIP, released in 2021, taught models to connect images and text - the backbone of text-to-image."
- text: "'Seed' is the random starting number. Same seed + same prompt = same image."
- text: "SDXL renders at 1024x1024 natively; older Stable Diffusion topped out at 512x512."
- text: "'Steps' are the number of denoising passes. Lightning models need as few as 4."
- text: "CFG scale controls how strictly the model follows your prompt. Too high and it gets crispy."
- text: "The term 'latent space' is where the model imagines before it paints the final pixels."
- text: "Training a large model can cost millions of dollars in compute. Your prompt is basically free."
- text: "'Inference' is the fancy word for actually running a trained model to get an answer."
- text: "LoRA lets you teach a big model a new style with a tiny add-on file - no full retraining."
- text: "AI image models don't store pictures; they learn statistical patterns and regenerate from scratch."
- text: "The word 'robot' comes from a 1920 Czech play and means 'forced labour'."
- text: "'Overfitting' is when a model memorises its training data instead of learning the general idea."
- text: "Reinforcement learning from human feedback (RLHF) is how chatbots learned to be helpful."
- text: "A GPU can do thousands of math operations at once - that's why AI loves them."
- text: "The 'attention mechanism' lets a model weigh which words matter most to each other."
