# AI Pictionary prompt pool. Copy to prompts.yaml to customise.
# forbidden  = surface forms the prompter may NOT type (whole-word, case-insensitive; phrases allowed)
# acceptedGuesses = normalized forms that count as a correct guess
# Keep targets wholesome, concrete, and visually unambiguous.

