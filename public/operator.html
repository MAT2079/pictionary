<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pictionary — Operator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Login gate -->
  <div class="panel login" id="loginPanel">
    <h3>Operator login</h3>
    <input id="pw" type="password" placeholder="Admin password" />
    <div class="row" style="margin-top:10px"><button id="loginBtn">Enter</button></div>
    <div id="loginMsg" class="notice bad hidden"></div>
  </div>

  <div class="wrap hidden" id="console">
    <div class="row spread">
      <h2>Operator Console</h2>
      <div class="row">
        <a href="/operator/settings"><button class="secondary">⚙ Settings</button></a>
        <span class="pill" id="phasePill">LOBBY</span>
        <span class="conn-dot"></span>
      </div>
    </div>

    <div class="panel">
      <div class="row spread">
        <div>
          <span class="muted">Turn</span> <strong id="turnInfo">—</strong> ·
          <span class="muted">Prompter</span> <strong id="prompterInfo">—</strong>
        </div>
        <div class="timer" id="timerInfo">—</div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="startGameBtn">▶ Start Game</button>
        <button id="advanceBtn" class="secondary">⏭ Advance Phase</button>
        <button id="nextTurnBtn" class="secondary">Next Turn →</button>
        <button id="skipBtn" class="secondary">Skip Turn</button>
        <button id="endBtn" class="danger">End Game</button>
      </div>
      <div id="opMsg" class="notice hidden"></div>
    </div>

    <!-- Generation status / errors -->
    <div class="panel" id="genPanel">
      <h3>Generation</h3>
      <div id="genStatus" class="muted">Idle.</div>
      <div id="genError" class="notice bad hidden"></div>
      <div class="row" style="margin-top:10px">
        <button id="retryBtn" class="secondary">↻ Retry Generation</button>
        <button id="vetoBtn" class="secondary">🚫 Reject &amp; Regenerate</button>
      </div>
    </div>

    <div class="grid cols2">
      <!-- Roster -->
      <div class="panel">
        <div class="row spread">
          <h3>Teams</h3>
          <label class="row" style="margin:0;gap:6px"><input type="checkbox" id="lockLobby" style="width:auto" /> Lock lobby</label>
        </div>
        <table id="rosterTable"><tbody></tbody></table>
      </div>

      <!-- Pool -->
      <div class="panel">
        <h3>Prompt pool</h3>
        <div id="poolStatus" class="muted"></div>
        <div id="poolWarn" class="notice warn hidden"></div>
        <div class="row" style="margin-top:10px">
          <button id="resetUsedBtn" class="secondary">Reset used flags</button>
        </div>
      </div>
    </div>

    <!-- Current target (operator can see everything) -->
    <div class="panel" id="targetPanel">
      <h3>This turn</h3>
      <div id="targetInfo" class="muted">—</div>
    </div>

    <!-- Candidates / veto preview -->
    <div class="panel hidden" id="candPanel">
      <h3>Candidates</h3>
      <div class="cards" id="candidates"></div>
    </div>

    <!-- Guess adjudication -->
    <div class="panel hidden" id="guessPanel">
      <h3>Guesses</h3>
      <table id="guessTable"><tbody></tbody></table>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    const { GameSocket, el, esc } = Pictionary;
    const gs = new GameSocket('operator');
    let authed = false;
    const savedPw = sessionStorage.getItem('pictionaryAdminPw');

    gs.onOpen = function () { if (savedPw) gs.send({ type: 'auth', password: savedPw }); };

    el('loginBtn').onclick = function () {
      const pw = el('pw').value;
      gs.send({ type: 'auth', password: pw });
    };
    el('pw').addEventListener('keydown', e => { if (e.key === 'Enter') el('loginBtn').click(); });

    gs.on('authResult', function (m) {
      if (m.ok) {
        authed = true;
        sessionStorage.setItem('pictionaryAdminPw', el('pw').value || savedPw);
        el('loginPanel').classList.add('hidden');
        el('console').classList.remove('hidden');
      } else {
        el('loginMsg').classList.remove('hidden');
        el('loginMsg').textContent = 'Wrong password.';
        sessionStorage.removeItem('pictionaryAdminPw');
      }
    });
    gs.on('error', function (m) { flash(m.message, 'bad'); });
    gs.on('opResult', function (m) {
      if (m.op === 'startGame' && m.ok === false) return;
    });

    function flash(text, kind) {
      const box = el('opMsg');
      box.className = 'notice ' + (kind === 'bad' ? 'bad' : 'good');
      box.textContent = text;
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    el('startGameBtn').onclick = () => gs.send({ type: 'startGame' });
    el('advanceBtn').onclick = () => gs.send({ type: 'advancePhase' });
    el('nextTurnBtn').onclick = () => gs.send({ type: 'nextTurn' });
    el('skipBtn').onclick = () => gs.send({ type: 'skipTurn' });
    el('endBtn').onclick = () => { if (confirm('End the game now?')) gs.send({ type: 'endGame' }); };
    el('retryBtn').onclick = () => gs.send({ type: 'retryGeneration' });
    el('vetoBtn').onclick = () => gs.send({ type: 'vetoRegenerate' });
    el('resetUsedBtn').onclick = () => gs.send({ type: 'resetUsed' });
    el('lockLobby').onchange = (e) => gs.send({ type: 'lockLobby', locked: e.target.checked });

    function renderRoster(st) {
      const rows = (st.teams || []).map(t => `
        <tr>
          <td>${esc(t.name)} ${t.connected ? '🟢' : '⚪'} ${t.id === st.prompterTeamId ? '<span class="tag">prompter</span>' : ''}</td>
          <td style="width:90px"><input type="number" value="${t.score}" data-team="${t.id}" class="scoreInput" /></td>
          <td style="width:60px"><button class="secondary setScore" data-team="${t.id}">Set</button></td>
        </tr>`).join('');
      el('rosterTable').querySelector('tbody').innerHTML = rows || '<tr><td class="muted">No teams yet.</td></tr>';
      el('rosterTable').querySelectorAll('.setScore').forEach(b => {
        b.onclick = () => {
          const inp = el('rosterTable').querySelector(`.scoreInput[data-team="${b.dataset.team}"]`);
          gs.send({ type: 'overrideScore', teamId: b.dataset.team, score: parseInt(inp.value, 10) || 0 });
        };
      });
    }

    function renderGuesses(st) {
      const isGuessPhase = st.phase === 'GUESS' || st.phase === 'SCORE';
      el('guessPanel').classList.toggle('hidden', !isGuessPhase);
      if (!isGuessPhase) return;
      const guesses = st.guesses || {};
      const rows = (st.teams || []).filter(t => t.id !== st.prompterTeamId).map(t => {
        const g = guesses[t.id];
        const status = !g ? '<span class="muted">— waiting —</span>'
          : g.correct ? '✅ correct' : '❌ "' + esc(g.text) + '"';
        const accept = (g && !g.correct) || (!g)
          ? `<button class="secondary acceptGuess" data-team="${t.id}">Accept</button>` : '';
        return `<tr><td>${esc(t.name)}</td><td>${status}</td><td style="width:90px">${accept}</td></tr>`;
      }).join('');
      el('guessTable').querySelector('tbody').innerHTML = rows || '<tr><td class="muted">No guessing teams.</td></tr>';
      el('guessTable').querySelectorAll('.acceptGuess').forEach(b => {
        b.onclick = () => gs.send({ type: 'acceptGuess', teamId: b.dataset.team });
      });
    }

    function renderCandidates(st) {
      const showCands = st.phase === 'PICK' && (st.candidates || []).length;
      el('candPanel').classList.toggle('hidden', !showCands);
      if (!showCands) return;
      el('candidates').innerHTML = st.candidates.map((src, i) =>
        `<div class="candidate ${i === st.chosenIndex ? 'chosen' : ''}"><span class="num">${i + 1}</span><img src="${src}" /></div>`).join('');
    }

    gs.onState(function (st) {
      if (st.type === 'needAuth') return;
      if (!authed) { authed = true; el('loginPanel').classList.add('hidden'); el('console').classList.remove('hidden'); }
      el('phasePill').textContent = st.phase;
      el('turnInfo').textContent = st.totalTurns ? `${st.turnNumber} / ${st.totalTurns}` : '—';
      const prompter = (st.teams || []).find(t => t.id === st.prompterTeamId);
      el('prompterInfo').textContent = prompter ? prompter.name : '—';
      el('lockLobby').checked = !!st.lobbyLocked;

      // Timer
      const secs = Math.ceil(gs.remaining(st.timer));
      el('timerInfo').textContent = st.timer && st.timer.endsAt ? `${st.timer.phase} ${secs}s` : '';

      // Generation
      const g = st.generation || {};
      el('genStatus').textContent = 'Status: ' + (g.status || 'idle');
      const errBox = el('genError');
      if (g.status === 'error') { errBox.classList.remove('hidden'); errBox.textContent = '⚠️ ' + g.error; }
      else errBox.classList.add('hidden');

      // Target (operator sees all)
      if (st.currentEntry) {
        el('targetInfo').innerHTML =
          `Target: <strong>${esc(st.currentEntry.target)}</strong> · ` +
          (st.currentPrompt ? `Prompt: “${esc(st.currentPrompt)}”` : '<span class="muted">no prompt yet</span>') +
          `<br><span class="muted">Forbidden: ${(st.currentEntry.forbidden || []).map(esc).join(', ')}</span>`;
      } else el('targetInfo').textContent = '—';

      // Pool
      if (st.pool) {
        el('poolStatus').textContent = `Available: ${st.pool.available} · Used: ${st.pool.used} · Total: ${st.pool.total} · Teams: ${st.pool.teams}`;
        el('poolWarn').classList.toggle('hidden', !st.pool.warning);
        if (st.pool.warning) el('poolWarn').textContent = '⚠️ Fewer available prompts than teams — add entries or reset used flags.';
      }

      renderRoster(st);
      renderGuesses(st);
      renderCandidates(st);

      el('startGameBtn').disabled = st.phase !== 'LOBBY';
    });
  </script>
</body>
</html>
