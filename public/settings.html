<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pictionary — Settings</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Login gate -->
  <div class="panel login" id="loginPanel">
    <h3>Settings login</h3>
    <input id="pw" type="password" placeholder="Admin password" />
    <div class="row" style="margin-top:10px"><button id="loginBtn">Enter</button></div>
    <div id="loginMsg" class="notice bad hidden"></div>
  </div>

  <div class="wrap hidden" id="page">
    <div class="row spread">
      <h2>Settings</h2>
      <div class="row">
        <a href="/operator"><button class="secondary">← Console</button></a>
        <span class="conn-dot"></span>
      </div>
    </div>

    <!-- Image backend -->
    <div class="panel">
      <h3>Image Backend</h3>
      <div class="grid cols2" id="grpBackend"></div>
      <div class="row" style="margin-top:12px">
        <button id="testBtn" class="good">Test Connection / Generate Test Image</button>
        <button id="loadModelsBtn" class="secondary">Load models from Forge</button>
      </div>
      <div id="testResult" class="notice hidden"></div>
      <img id="testImg" class="hidden" style="margin-top:10px;max-width:280px;border-radius:10px" />
    </div>

    <div class="grid cols2">
      <div class="panel"><h3>Timers</h3><div class="grid" id="grpTimers"></div></div>
      <div class="panel"><h3>Scoring</h3><div class="grid" id="grpScoring"></div></div>
    </div>

    <div class="panel"><h3>Game</h3><div class="grid cols2" id="grpGame"></div></div>

    <div class="panel">
      <div class="row spread"><h3>Save</h3><span class="muted">Live edits apply immediately on Save.</span></div>
      <div class="row"><button id="saveBtn">💾 Save settings</button><span id="saveMsg" class="muted"></span></div>
    </div>

    <!-- Prompt pool manager -->
    <div class="panel">
      <h3>Prompt Pool</h3>
      <div id="poolMsg" class="muted"></div>
      <table id="promptTable"><thead><tr><th>Target</th><th>Forbidden</th><th>Accepted</th><th>Used</th><th></th></tr></thead><tbody></tbody></table>
      <h4 style="margin-top:16px">Add / edit entry</h4>
      <div class="grid cols2">
        <div><label>id</label><input id="pId" placeholder="lion" /></div>
        <div><label>target</label><input id="pTarget" placeholder="Lion" /></div>
        <div><label>forbidden (comma-separated)</label><input id="pForbidden" placeholder="lion, mane, big cat" /></div>
        <div><label>acceptedGuesses (comma-separated)</label><input id="pAccepted" placeholder="lion, lions" /></div>
        <div><label>category</label><input id="pCategory" placeholder="animals" /></div>
        <div><label>difficulty</label>
          <select id="pDifficulty"><option value="">—</option><option>easy</option><option>medium</option><option>hard</option></select>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="savePrompt">Add / update</button>
        <button id="resetUsed2" class="secondary">Reset used flags</button>
      </div>
    </div>

    <!-- Trivia manager -->
    <div class="panel">
      <h3>Trivia</h3>
      <table id="triviaTable"><tbody></tbody></table>
      <div class="grid cols2" style="margin-top:10px">
        <div><label>id</label><input id="tId" placeholder="t16" /></div>
        <div><label>text</label><input id="tText" placeholder="A fun fact…" /></div>
      </div>
      <div class="row" style="margin-top:10px"><button id="saveTrivia">Add / update</button></div>
    </div>

    <!-- Profanity -->
    <div class="panel">
      <h3>Profanity list</h3>
      <label>Words (comma-separated, whole-word matched)</label>
      <textarea id="profanity"></textarea>
      <div class="row" style="margin-top:10px"><button id="saveProfanity">Save list</button></div>
    </div>

    <!-- Backup -->
    <div class="panel">
      <h3>Backup</h3>
      <div class="row">
        <button id="exportSettings" class="secondary">⬇ Export settings JSON</button>
        <button id="exportScores" class="secondary">⬇ Export scores JSON</button>
        <label class="secondary" style="margin:0;padding:10px 16px;border-radius:10px;background:var(--panel2);cursor:pointer;display:inline-block;width:auto">
          ⬆ Import settings JSON<input type="file" id="importFile" accept="application/json" style="display:none" />
        </label>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    const { GameSocket, el, esc, download } = Pictionary;
    const gs = new GameSocket('settings');
    let authed = false, settings = {};
    const savedPw = sessionStorage.getItem('pictionaryAdminPw');

    // Field schema (group -> [ {key, type, opts} ]).
    const SCHEMA = {
      grpBackend: [
        ['FORGE_URL', 'text', { ph: 'https://xxx.trycloudflare.com' }],
        ['FORGE_AUTH_HEADER', 'text', { ph: 'optional auth header' }],
        ['MODEL_CHECKPOINT', 'model', {}],
        ['SAMPLER', 'text', {}],
        ['STEPS', 'number', {}],
        ['CFG_SCALE', 'number', { step: '0.1' }],
        ['WIDTH', 'number', {}],
        ['HEIGHT', 'number', {}],
        ['N_CANDIDATES', 'number', {}],
        ['SEQUENTIAL_GEN', 'bool', {}],
        ['NEGATIVE_PROMPT', 'text', {}],
        ['SAFETY_CHECKER', 'bool', {}],
        ['GEN_TIMEOUT_SECONDS', 'number', {}],
        ['MIRROR_IMAGE_TO_PHONES', 'bool', {}]
      ],
      grpTimers: [
        ['COMPOSE_SECONDS', 'number', {}], ['PICK_SECONDS', 'number', {}],
        ['GUESS_SECONDS', 'number', {}], ['TRIVIA_DELAY_SECONDS', 'number', {}],
        ['TRIVIA_ROTATE_SECONDS', 'number', {}]
      ],
      grpScoring: [
        ['CORRECT_POINTS', 'number', {}], ['SPEED_BONUS_ENABLED', 'bool', {}],
        ['FIRST_CORRECT_BONUS', 'number', {}], ['PROMPTER_POINTS_PER_TEAM', 'number', {}],
        ['ZERO_IF_NONE', 'bool', {}]
      ],
      grpGame: [
        ['ROUNDS', 'number', {}], ['MIN_TEAMS', 'number', {}], ['ALLOWED_CHARS', 'text', { ro: true }]
      ]
    };
    let modelOptions = [];

    function fieldHtml(key, type, opts) {
      const id = 'f_' + key;
      if (type === 'bool') {
        return `<div><label>${key}</label><select id="${id}"><option value="true">true</option><option value="false">false</option></select></div>`;
      }
      if (type === 'model') {
        return `<div><label>${key}</label><select id="${id}"><option value="">(use Forge default)</option></select></div>`;
      }
      const t = type === 'number' ? 'number' : 'text';
      const step = opts.step ? `step="${opts.step}"` : '';
      const ro = opts.ro ? 'readonly' : '';
      return `<div><label>${key}</label><input id="${id}" type="${t}" ${step} ${ro} placeholder="${opts.ph || ''}" /></div>`;
    }

    function buildForm() {
      for (const [grp, fields] of Object.entries(SCHEMA)) {
        el(grp).innerHTML = fields.map(([k, t, o]) => fieldHtml(k, t, o)).join('');
      }
    }
    function fillForm() {
      for (const fields of Object.values(SCHEMA)) {
        for (const [key, type] of fields) {
          const node = el('f_' + key);
          if (!node) continue;
          const val = settings[key];
          if (type === 'bool') node.value = (val === true || val === 'true') ? 'true' : 'false';
          else node.value = (val == null ? '' : val);
        }
      }
      // model dropdown
      const m = el('f_MODEL_CHECKPOINT');
      if (m) {
        const opts = ['<option value="">(use Forge default)</option>']
          .concat(modelOptions.map(x => `<option ${x === settings.MODEL_CHECKPOINT ? 'selected' : ''}>${esc(x)}</option>`));
        m.innerHTML = opts.join('');
        if (settings.MODEL_CHECKPOINT && !modelOptions.includes(settings.MODEL_CHECKPOINT)) {
          m.insertAdjacentHTML('beforeend', `<option selected>${esc(settings.MODEL_CHECKPOINT)}</option>`);
        }
      }
    }
    function collectForm() {
      const patch = {};
      for (const fields of Object.values(SCHEMA)) {
        for (const [key, type] of fields) {
          const node = el('f_' + key);
          if (!node) continue;
          if (type === 'bool') patch[key] = node.value === 'true';
          else if (type === 'number') patch[key] = node.value === '' ? '' : Number(node.value);
          else patch[key] = node.value;
        }
      }
      return patch;
    }

    // ---- Auth ----
    gs.onOpen = () => { if (savedPw) gs.send({ type: 'auth', password: savedPw }); };
    el('loginBtn').onclick = () => gs.send({ type: 'auth', password: el('pw').value });
    el('pw').addEventListener('keydown', e => { if (e.key === 'Enter') el('loginBtn').click(); });
    gs.on('authResult', m => {
      if (m.ok) {
        authed = true;
        sessionStorage.setItem('pictionaryAdminPw', el('pw').value || savedPw);
        el('loginPanel').classList.add('hidden'); el('page').classList.remove('hidden');
        buildForm();
      } else { el('loginMsg').classList.remove('hidden'); el('loginMsg').textContent = 'Wrong password.'; }
    });

    // ---- Save settings ----
    el('saveBtn').onclick = () => {
      gs.send({ type: 'updateSettings', patch: collectForm() });
      el('saveMsg').textContent = 'Saved ✓';
      setTimeout(() => el('saveMsg').textContent = '', 2500);
    };

    // ---- Forge test + models ----
    el('loadModelsBtn').onclick = () => { gs.send({ type: 'updateSettings', patch: collectForm() }); gs.send({ type: 'listModels' }); };
    el('testBtn').onclick = () => {
      gs.send({ type: 'updateSettings', patch: collectForm() });
      const box = el('testResult'); box.className = 'notice warn'; box.textContent = 'Testing…';
      gs.send({ type: 'testConnection' });
    };
    gs.on('opResult', m => {
      if (m.op === 'listModels') {
        if (m.ok) { modelOptions = m.models; fillForm(); el('saveMsg').textContent = `Loaded ${m.models.length} models`; }
        else flashTest('Could not list models: ' + m.error, 'bad');
      } else if (m.op === 'testConnection') {
        if (m.ok) { flashTest(`✅ Success in ${(m.ms/1000).toFixed(1)}s`, 'good'); if (m.image) { el('testImg').src = m.image; el('testImg').classList.remove('hidden'); } }
        else flashTest('❌ ' + m.error, 'bad');
      } else if (m.op === 'exportSettings') {
        download('pictionary-settings.json', JSON.stringify({ settings: m.settings, prompts: m.prompts, trivia: m.trivia, profanity: m.profanity }, null, 2));
      } else if (m.op === 'exportScores') {
        download('pictionary-scores.json', JSON.stringify(m.scores, null, 2));
      }
    });
    function flashTest(text, kind) { const b = el('testResult'); b.className = 'notice ' + kind; b.textContent = text; }

    // ---- Prompt pool ----
    el('savePrompt').onclick = () => {
      const entry = {
        id: el('pId').value.trim(),
        target: el('pTarget').value.trim(),
        forbidden: splitList(el('pForbidden').value),
        acceptedGuesses: splitList(el('pAccepted').value),
        category: el('pCategory').value.trim(),
        difficulty: el('pDifficulty').value
      };
      if (!entry.id) return alert('id is required');
      gs.send({ type: 'upsertPrompt', entry });
      ['pId','pTarget','pForbidden','pAccepted','pCategory'].forEach(i => el(i).value = '');
    };
    el('resetUsed2').onclick = () => gs.send({ type: 'resetUsed' });
    function splitList(s) { return String(s||'').split(',').map(x => x.trim()).filter(Boolean); }

    function renderPrompts(prompts, pool) {
      el('poolMsg').textContent = pool ? `Available ${pool.available} / Total ${pool.total} · Teams ${pool.teams}${pool.warning ? ' ⚠️ pool < teams' : ''}` : '';
      el('promptTable').querySelector('tbody').innerHTML = (prompts || []).map(p => `
        <tr>
          <td>${esc(p.target)} <span class="muted">(${esc(p.id)})</span></td>
          <td class="muted" style="max-width:220px">${(p.forbidden||[]).map(esc).join(', ')}</td>
          <td class="muted">${(p.acceptedGuesses||[]).map(esc).join(', ')}</td>
          <td>${p.used ? '✔' : ''}</td>
          <td><button class="secondary editP" data-id="${esc(p.id)}">Edit</button> <button class="danger delP" data-id="${esc(p.id)}">✕</button></td>
        </tr>`).join('');
      el('promptTable').querySelectorAll('.delP').forEach(b => b.onclick = () => gs.send({ type: 'removePrompt', id: b.dataset.id }));
      el('promptTable').querySelectorAll('.editP').forEach(b => b.onclick = () => {
        const p = prompts.find(x => x.id === b.dataset.id); if (!p) return;
        el('pId').value = p.id; el('pTarget').value = p.target;
        el('pForbidden').value = (p.forbidden||[]).join(', ');
        el('pAccepted').value = (p.acceptedGuesses||[]).join(', ');
        el('pCategory').value = p.category || ''; el('pDifficulty').value = p.difficulty || '';
        window.scrollTo(0, document.body.scrollHeight);
      });
    }

    // ---- Trivia ----
    el('saveTrivia').onclick = () => {
      const item = { id: el('tId').value.trim(), text: el('tText').value.trim() };
      if (!item.id || !item.text) return alert('id and text required');
      gs.send({ type: 'upsertTrivia', item });
      el('tId').value = ''; el('tText').value = '';
    };
    function renderTrivia(trivia) {
      el('triviaTable').querySelector('tbody').innerHTML = (trivia || []).map(t => `
        <tr><td class="muted" style="width:60px">${esc(t.id)}</td><td>${esc(t.text)}</td>
        <td style="width:50px"><button class="danger delT" data-id="${esc(t.id)}">✕</button></td></tr>`).join('');
      el('triviaTable').querySelectorAll('.delT').forEach(b => b.onclick = () => gs.send({ type: 'removeTrivia', id: b.dataset.id }));
    }

    // ---- Profanity ----
    el('saveProfanity').onclick = () => gs.send({ type: 'setProfanity', list: splitList(el('profanity').value) });

    // ---- Backup ----
    el('exportSettings').onclick = () => gs.send({ type: 'exportSettings' });
    el('exportScores').onclick = () => gs.send({ type: 'exportScores' });
    el('importFile').onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { const data = JSON.parse(reader.result); gs.send({ type: 'importSettings', data }); el('saveMsg').textContent = 'Imported ✓'; }
        catch (err) { alert('Invalid JSON: ' + err.message); }
      };
      reader.readAsText(file);
    };

    // ---- State ----
    let formDirtyOnce = false;
    gs.onState(st => {
      if (st.type === 'needAuth') return;
      if (!authed) { authed = true; el('loginPanel').classList.add('hidden'); el('page').classList.remove('hidden'); buildForm(); }
      if (st.fullSettings) {
        settings = st.fullSettings;
        if (!formDirtyOnce) { fillForm(); formDirtyOnce = true; }
      }
      renderPrompts(st.prompts, st.pool);
      renderTrivia(st.trivia);
      if (st.profanity && document.activeElement !== el('profanity')) el('profanity').value = (st.profanity || []).join(', ');
    });
  </script>
</body>
</html>
