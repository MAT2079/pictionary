# Windows (primary) Forge + worker stack (spec §16).
# Two services on a shared private network. Forge is NOT published to the host's
# public interface; the worker reaches it in-network at http://forge:7860.
# (Optionally publish to 127.0.0.1:7860 for local debugging only — see below.)
#
# Requires: Docker Desktop (WSL2 backend) + NVIDIA Container Toolkit + a current
# NVIDIA driver providing WSL CUDA. See forge-setup-windows.md.

services:
  forge:
    build:
      context: .
      dockerfile: forge.Dockerfile
    # If you prefer a trusted prebuilt image, replace `build:` with `image:`.
    container_name: aip-forge
    restart: unless-stopped
    # GPU passthrough.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Some setups still need this legacy flag instead of `deploy`. Uncomment if so:
    # gpus: all
    environment:
      - COMMANDLINE_ARGS=--api --listen --port 7860 --xformers
    volumes:
      # Checkpoints/LoRA live on the host, never committed. See §18 for files.
      - ./models/Stable-diffusion:/app/models/Stable-diffusion
      - ./models/Lora:/app/models/Lora
      - ./models/VAE:/app/models/VAE
      - ./outputs:/app/outputs
    networks: [aip]
    # Debug-only: expose Forge to localhost. Do NOT publish 0.0.0.0.
    ports:
      - "127.0.0.1:7860:7860"
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:7860/sdapi/v1/sd-models || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 180s

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: aip-worker
    restart: unless-stopped
    depends_on:
      forge:
        condition: service_healthy
    environment:
      # RENDER_URL + WORKER_SECRET come from the sibling .env (the Discord bot
      # writes RENDER_URL there; set WORKER_SECRET to match the server's value).
      - RENDER_URL=${RENDER_URL}
      - WORKER_SECRET=${WORKER_SECRET}
      - FORGE_URL=http://forge:7860
      - NSFW_REGEN_ATTEMPTS=${NSFW_REGEN_ATTEMPTS:-2}
    networks: [aip]
    # Outbound-only: no ports published.

networks:
  aip:
    driver: bridge
