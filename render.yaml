# Render Blueprint for AI Pictionary (single free web service).
# The server serves the built React frontend (all four views) as static assets.
services:
  - type: web
    name: ai-pictionary
    runtime: node
    plan: free
    # Builds web/ (Vite) then server/ (tsc). Root install hoists workspace deps.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: OPERATOR_PASSWORD
        value: adminburger
      - key: WORKER_SECRET
        generateValue: true
      # BASE_URL is normally derived from the request host; override only for
      # all-local / LAN mode so the join QR points at the right address.
      - key: NODE_VERSION
        value: "20"
