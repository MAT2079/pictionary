# Render Blueprint — provisions the AI Pictionary web service in one click.
# Git-driven: every push to the tracked branch auto-builds and redeploys.
services:
  - type: web
    name: ai-pictionary
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
